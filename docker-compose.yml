version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: alpaca-db
    environment:
      POSTGRES_DB: alpaca_database
      POSTGRES_USER: alpaca_user
      POSTGRES_PASSWORD: alpaca_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpaca_user -d alpaca_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpaca-backend
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.base
      - DEBUG=true
      - USE_SQLITE=false
      - DB_NAME=alpaca_database
      - DB_USER=alpaca_user
      - DB_PASSWORD=alpaca_dev_password
      - DB_HOST=db
      - DB_PORT=5432
      - FRONTEND_URL=http://localhost:5173
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ALLOWED_HOSTS=localhost,127.0.0.1
      # Add your API keys here or use .env file
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8080
      "

  # React Frontend (development)
  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: alpaca-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
      - ./dashboard/index.html:/app/index.html
      - ./dashboard/vite.config.js:/app/vite.config.js
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

networks:
  default:
    name: alpaca-network
