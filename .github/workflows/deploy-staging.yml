name: Deploy to Staging

on:
  push:
    branches: [staging]

env:
  GCP_PROJECT: samaanai-stg-1009-124126
  GCP_REGION: us-west1
  BACKEND_SERVICE: alpaca-api-staging
  FRONTEND_SERVICE: alpaca-dashboard-staging
  AGENT_JOB: alpaca-agent-staging

jobs:
  deploy-backend:
    name: Deploy Django Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Docker image
        run: |
          docker build -t gcr.io/$GCP_PROJECT/$BACKEND_SERVICE:${{ github.sha }} .
          docker push gcr.io/$GCP_PROJECT/$BACKEND_SERVICE:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: gcr.io/${{ env.GCP_PROJECT }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --add-cloudsql-instances=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db
          env_vars: |
            DJANGO_SETTINGS_MODULE=backend.settings.production
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DB_USER=samaanai_backend
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=alpaca_database
            INSTANCE_CONNECTION_NAME=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db
            ALLOWED_HOSTS=api.stg.alpaca.samaanai.com
            FRONTEND_URL=https://stg.alpaca.samaanai.com
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            ALPACA_CLIENT_ID=${{ secrets.ALPACA_CLIENT_ID }}
            ALPACA_CLIENT_SECRET=${{ secrets.ALPACA_CLIENT_SECRET }}
            ALPACA_REDIRECT_URI=https://stg.alpaca.samaanai.com/alpaca/callback
            SESSION_COOKIE_DOMAIN=.stg.alpaca.samaanai.com
            CSRF_COOKIE_DOMAIN=.stg.alpaca.samaanai.com

      - name: Show Backend URL
        run: |
          echo "✅ Backend deployed to: $(gcloud run services describe $BACKEND_SERVICE --region=$GCP_REGION --format='value(status.url)')"

  deploy-agent:
    name: Deploy Trading Agent Job
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Deploy Cloud Run Job for Trading Agent
        run: |
          # Use the same backend image (same codebase, different entrypoint)
          IMAGE="gcr.io/$GCP_PROJECT/$BACKEND_SERVICE:${{ github.sha }}"

          # Check if job exists
          if gcloud run jobs describe $AGENT_JOB --region=$GCP_REGION 2>/dev/null; then
            echo "Updating existing job..."
            gcloud run jobs update $AGENT_JOB \
              --region=$GCP_REGION \
              --image=$IMAGE \
              --command="/bin/bash" \
              --args="/app/agent-entrypoint.sh" \
              --memory=512Mi \
              --cpu=1 \
              --task-timeout=300s \
              --max-retries=1 \
              --set-cloudsql-instances=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db \
              --set-env-vars="DJANGO_SETTINGS_MODULE=backend.settings.production" \
              --set-env-vars="DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" \
              --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              --set-env-vars="DB_USER=samaanai_backend" \
              --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              --set-env-vars="DB_NAME=alpaca_database" \
              --set-env-vars="INSTANCE_CONNECTION_NAME=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db" \
              --set-env-vars="ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" \
              --set-env-vars="ALLOWED_HOSTS=api.stg.alpaca.samaanai.com" \
              --set-env-vars="FRONTEND_URL=https://stg.alpaca.samaanai.com"
          else
            echo "Creating new job..."
            gcloud run jobs create $AGENT_JOB \
              --region=$GCP_REGION \
              --image=$IMAGE \
              --command="/bin/bash" \
              --args="/app/agent-entrypoint.sh" \
              --memory=512Mi \
              --cpu=1 \
              --task-timeout=300s \
              --max-retries=1 \
              --set-cloudsql-instances=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db \
              --set-env-vars="DJANGO_SETTINGS_MODULE=backend.settings.production" \
              --set-env-vars="DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" \
              --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              --set-env-vars="DB_USER=samaanai_backend" \
              --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              --set-env-vars="DB_NAME=alpaca_database" \
              --set-env-vars="INSTANCE_CONNECTION_NAME=samaanai-stg-1009-124126:us-west1:samaanai-backend-staging-db" \
              --set-env-vars="ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" \
              --set-env-vars="ALLOWED_HOSTS=api.stg.alpaca.samaanai.com" \
              --set-env-vars="FRONTEND_URL=https://stg.alpaca.samaanai.com"
          fi

          echo "✅ Agent job deployed: $AGENT_JOB"

      - name: Setup Cloud Scheduler (Market Hours)
        run: |
          # Schedule: Every 15 min, Mon-Fri, 9:30 AM - 4:00 PM ET (6:30 AM - 1:00 PM PT)
          # Cron: */15 6-13 * * 1-5 (PT) — covers 6:00am-1:00pm PT = 9:00am-4:00pm ET
          SCHEDULER_NAME="${AGENT_JOB}-scheduler"
          SERVICE_ACCOUNT="${{ secrets.GCP_SA_EMAIL || '' }}"

          # Get the project number for the service account
          PROJECT_NUMBER=$(gcloud projects describe $GCP_PROJECT --format='value(projectNumber)')

          # Use default compute service account if no specific SA is set
          if [ -z "$SERVICE_ACCOUNT" ]; then
            SERVICE_ACCOUNT="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi

          # Check if scheduler already exists
          if gcloud scheduler jobs describe $SCHEDULER_NAME --location=$GCP_REGION 2>/dev/null; then
            echo "Updating existing scheduler..."
            gcloud scheduler jobs update http $SCHEDULER_NAME \
              --location=$GCP_REGION \
              --schedule="*/15 6-13 * * 1-5" \
              --time-zone="America/Los_Angeles" \
              --uri="https://${GCP_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${GCP_PROJECT}/jobs/${AGENT_JOB}:run" \
              --http-method=POST \
              --oauth-service-account-email="${SERVICE_ACCOUNT}" \
              --attempt-deadline=320s
          else
            echo "Creating new scheduler..."
            gcloud scheduler jobs create http $SCHEDULER_NAME \
              --location=$GCP_REGION \
              --schedule="*/15 6-13 * * 1-5" \
              --time-zone="America/Los_Angeles" \
              --uri="https://${GCP_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${GCP_PROJECT}/jobs/${AGENT_JOB}:run" \
              --http-method=POST \
              --oauth-service-account-email="${SERVICE_ACCOUNT}" \
              --attempt-deadline=320s
          fi

          echo "✅ Scheduler configured: Every 15 min during market hours (Mon-Fri 9:30am-4pm ET)"

  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Get Backend URL
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe $BACKEND_SERVICE --region=$GCP_REGION --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        working-directory: dashboard
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.stg.alpaca.samaanai.com \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            -t gcr.io/$GCP_PROJECT/$FRONTEND_SERVICE:${{ github.sha }} .
          docker push gcr.io/$GCP_PROJECT/$FRONTEND_SERVICE:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: gcr.io/${{ env.GCP_PROJECT }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=2

      - name: Show Frontend URL
        run: |
          echo "✅ Frontend deployed to: $(gcloud run services describe $FRONTEND_SERVICE --region=$GCP_REGION --format='value(status.url)')"

  post-deploy:
    name: Post-Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-agent]

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deployment Summary
        run: |
          BACKEND_URL=$(gcloud run services describe $BACKEND_SERVICE --region=$GCP_REGION --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe $FRONTEND_SERVICE --region=$GCP_REGION --format='value(status.url)')

          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | $BACKEND_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Dashboard | $FRONTEND_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Trading Agent Job | $AGENT_JOB (every 15 min during market hours) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trading Agent Schedule" >> $GITHUB_STEP_SUMMARY
          echo "- **Frequency:** Every 15 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Hours:** Mon-Fri 9:30 AM - 4:00 PM ET" >> $GITHUB_STEP_SUMMARY
          echo "- **Symbol:** SPY (configurable)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit the frontend URL to verify the deployment" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Operations tab for agent decisions" >> $GITHUB_STEP_SUMMARY
          echo "3. Check \`/api/health\` endpoint on the backend" >> $GITHUB_STEP_SUMMARY
